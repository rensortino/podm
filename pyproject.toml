[project]
name = "podm"
version = "0.1.0"
description = "Exercises for implementing diffusion models from first principles (The Principles of Diffusion Models)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8", "jupyter>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["podm"]

[tool.pytest.ini_options]
testpaths = ["exercises"]
addopts = "-q"
filterwarnings = ["ignore::FutureWarning:torch.*"]
